name: CI

on: 
  # push: -- just run on PRs for now
  pull_request:
  workflow_dispatch:

jobs:
  build_target_branch:
    name: Build target branch (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:13-3.0
        env:
          POSTGRES_PASSWORD: postgis
          POSTGRES_DB: mariner_app
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true

      - name: Checkout into target branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.ref }}
          path: .

      - name: Build and test branch
        uses: ./.github/actions/build-and-test-branch
        with:
          secrets: ${{ toJSON(secrets) }}
          project-name: 'mariner_app'
          branch-type: 'target'
          python-version: ${{ matrix.python-version }}

  build_feature_branch:
    name: Build feature branch (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:13-3.0
        env:
          POSTGRES_PASSWORD: postgis
          POSTGRES_DB: mariner_app
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true

      - name: Checkout into feature branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          path: .

      - name: Build and test branch
        uses: ./.github/actions/build-and-test-branch
        with:
          secrets: ${{ toJSON(secrets) }}
          project-name: 'mariner_app'
          branch-type: 'feature'
          python-version: ${{ matrix.python-version }}

  check_coverage:
    name: Check coverage report (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [build_feature_branch, build_target_branch]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Download feature branch frontend coverage report artifact
        uses: actions/download-artifact@v4
        with:
          name: feature-branch-frontend-${{ matrix.python-version }}-coverage-report
          path: .

      - name: Download target branch frontend coverage report artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: target-branch-frontend-${{ matrix.python-version }}-coverage-report
          path: .

      - name: Download feature branch Python coverage report artifact
        uses: actions/download-artifact@v4
        with:
          name: feature-branch-python-${{ matrix.python-version }}-coverage-report
          path: .

      - name: Download target branch Python coverage report artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: target-branch-python-${{ matrix.python-version }}-coverage-report
          path: .

      - name: Compare and report frontend + Python coverage
        if: github.event_name == 'pull_request'
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: |
          python - << 'PY'
          import json
          import os
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          py_ver = os.environ["PY_VERSION"]

          feature_frontend_file = Path(f"feature_branch_frontend_{py_ver}_coverage.xml")
          target_frontend_file = Path(f"target_branch_frontend_{py_ver}_coverage.xml")
          feature_python_file = Path(f"feature_branch_python_{py_ver}_coverage.json")
          target_python_file = Path(f"target_branch_python_{py_ver}_coverage.json")

          if not feature_frontend_file.exists():
            print(f"Missing expected file: {feature_frontend_file}", file=sys.stderr)
            sys.exit(1)
          if not feature_python_file.exists():
            print(f"Missing expected file: {feature_python_file}", file=sys.stderr)
            sys.exit(1)

          def parse_frontend_coverage(path: Path) -> float:
            xml_root = ET.parse(path).getroot()
            metrics = xml_root.find(".//metrics")
            if metrics is None:
              return 0.0

            statements = float(metrics.attrib.get("statements", 0))
            covered_statements = float(metrics.attrib.get("coveredstatements", 0))
            conditionals = float(metrics.attrib.get("conditionals", 0))
            covered_conditionals = float(metrics.attrib.get("coveredconditionals", 0))
            methods = float(metrics.attrib.get("methods", 0))
            covered_methods = float(metrics.attrib.get("coveredmethods", 0))
            elements = float(metrics.attrib.get("elements", 0))
            covered_elements = float(metrics.attrib.get("coveredelements", 0))

            coverages = []
            if statements > 0:
              coverages.append((covered_statements / statements) * 100)
            if conditionals > 0:
              coverages.append((covered_conditionals / conditionals) * 100)
            if methods > 0:
              coverages.append((covered_methods / methods) * 100)
            if elements > 0:
              coverages.append((covered_elements / elements) * 100)

            if not coverages:
              return 0.0
            return sum(coverages) / len(coverages)

          def parse_python_coverage(path: Path) -> float:
            with path.open("r", encoding="utf-8") as coverage_file:
              data = json.load(coverage_file)
            return float(data.get("totals", {}).get("percent_covered", 0.0))

          feature_frontend_coverage = parse_frontend_coverage(feature_frontend_file)
          target_frontend_coverage = parse_frontend_coverage(target_frontend_file) if target_frontend_file.exists() else 0.0
          feature_python_coverage = parse_python_coverage(feature_python_file)
          target_python_coverage = parse_python_coverage(target_python_file) if target_python_file.exists() else 0.0

          summary_lines = [
            f"### Coverage Report (Python {py_ver})",
            "",
            "| Coverage Type | Feature Branch | Target Branch | Delta |",
            "| --- | ---: | ---: | ---: |",
            f"| Frontend | {feature_frontend_coverage:.2f}% | {target_frontend_coverage:.2f}% | {feature_frontend_coverage - target_frontend_coverage:+.2f}% |",
            f"| Python | {feature_python_coverage:.2f}% | {target_python_coverage:.2f}% | {feature_python_coverage - target_python_coverage:+.2f}% |",
            "",
          ]

          if not target_frontend_file.exists() or not target_python_file.exists():
            summary_lines.append("Target branch coverage artifact missing for at least one report type; target coverage defaults to 0.00%.")
            summary_lines.append("")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary_file:
            summary_file.write("\n".join(summary_lines))

          if feature_frontend_coverage < target_frontend_coverage:
            print(
              f"Frontend coverage decreased: {feature_frontend_coverage:.2f}% < {target_frontend_coverage:.2f}%",
              file=sys.stderr,
            )
            sys.exit(1)

          if feature_python_coverage < target_python_coverage:
            print(
              f"Python coverage decreased: {feature_python_coverage:.2f}% < {target_python_coverage:.2f}%",
              file=sys.stderr,
            )
            sys.exit(1)

          print(
            f"Coverage checks passed for Python {py_ver}: frontend {feature_frontend_coverage:.2f}% vs {target_frontend_coverage:.2f}%, "
            f"python {feature_python_coverage:.2f}% vs {target_python_coverage:.2f}%."
          )
          PY